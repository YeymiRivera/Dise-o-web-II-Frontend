<div class="container mt-4">
  <h2 class="text-primary">{{ id() === null ? 'Nuevo Socio' : 'Editar Socio' }}</h2>

  <form (ngSubmit)="guardar()" class="card p-4 shadow-sm">
    @if (error(); as mensaje) {
      <div class="alert alert-danger">{{ mensaje }}</div>
    }

    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" class="form-control" maxlength="100" required [(ngModel)]="nombre" />
    </div>

    <div class="mb-3">
      <label for="ci" class="form-label">CI</label>
      <input id="ci" name="ci" type="text" class="form-control" maxlength="15" required [(ngModel)]="ci" />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email (opcional)</label>
      <input id="email" name="email" type="email" class="form-control" maxlength="100" [(ngModel)]="email" />
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono (opcional)</label>
      <input id="telefono" name="telefono" type="text" class="form-control" maxlength="20" [(ngModel)]="telefono" />
    </div>

    <div class="d-flex justify-content-between">
      <a routerLink="/socios" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-success" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
