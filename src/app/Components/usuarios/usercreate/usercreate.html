
<div class="container mt-4">
    <h2 class="text-primary">Registrar Nuevo Usuario</h2>

    <form  class="card p-4 shadow-sm">
        <div  class="text-danger"></div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label  class="form-label">Nombre</label>
                <input
                id="nombre"
                name="nombre"
                type="text" class="form-control" [(ngModel)]="nuevousuario.nombre" required />
                <span  class="text-danger"></span>
            </div>
            <div class="col-md-6 mb-3">
                <label  class="form-label">Email</label>
               <input
          id="email"
          name="email"
          class="form-control"
          type="email"
          [(ngModel)]="nuevousuario.email"
          required/>
                <span  class="text-danger"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label  class="form-label">Contraseña</label>
                <input
          id="password"
          name="password"
          class="form-control"
          type="password"
          [(ngModel)]="nuevousuario.passwordHash"
          required/>
        </div>
       <div class="col-md-6 mb-3">
  <label for="rol" class="form-label">Rol</label>

  <select
    id="rol"
    name="rol"
    class="form-select"
    [(ngModel)]="nuevousuario.rol"
    required
  >
   
    <option [ngValue]="undefined" disabled>
      -- Seleccione un rol --
    </option>

    <option *ngFor="let rol of roles" [ngValue]="rol.id">
      {{rol.rol}}
    </option>
  </select>
</div>
        </div>
        <div class="d-flex justify-content-between">
            <button 
            (click)="Volver()"
            class="btn-secondary">Volver</button>
            <button 
            (click)="PostUsuario()"
            type="submit" class="btn btn-success">Guardar Registro</button>
        </div>
    </form>
</div>
