
<div class="container mt-4">
    <h2 class="text-primary">Editar Usuario</h2>
    <form  class="card p-4 shadow-sm">
        <input type="hidden"  />
        <div  class="text-danger"></div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label  class="form-label">Nombre</label>
                <input id="nombre" name="nombre" type="text" [(ngModel)]="usuarioeditado.nombre" class="form-control" required/>
                <span  class="text-danger"></span>
            </div>
            <div class="col-md-6 mb-3">
                <label  class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" [(ngModel)]="usuarioeditado.email" required/>
                <span lass="text-danger"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label  class="form-label">Contraseña</label>
                <input  
                id="contraseña"
                name="contrasela"
                class="form-control" type="password"
                [(ngModel)]="usuarioeditado.passwordHash"  />
                <span  class="text-danger"></span>
            </div>
            <div class="col-md-6 mb-3">
                <label  class="form-label">Rol</label>
                <select id="rol" name="rol"  class="form-control" [(ngModel)]="usuarioeditado.rol" required >
                    <option [ngValue]="undefined" disabled>
      -- Seleccione un rol --
    </option>

    <option *ngFor="let rol of roles" [ngValue]="rol.id">
      {{rol.rol}}
    </option>
                </select>
            </div>
        </div>
        <div class="d-flex justify-content-between">
            <button (click)="Volver()" class="btn btn-secondary">Volver</button>
            <button (click)="PutUsuario()" type="submit" class="btn btn-success">Guardar Cambios</button>
        </div>
    </form>
</div>
