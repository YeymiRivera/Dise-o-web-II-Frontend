<div class="card h-100 shadow-sm border-0 rounded-3 text-center p-3">
  <div class="card-body d-flex flex-column justify-content-between">
    <div>
      <h5 class="card-title fw-bold text-primary">{{ modulo.titulo }}</h5>
      <p class="card-text text-muted small mt-2">{{ modulo.descripcion }}</p>
    </div>
    <div class="mt-4">
      <a [routerLink]="modulo.ruta" class="btn btn-outline-primary btn-sm rounded-pill px-4">
        Ingresar
      </a>
    </div>
  </div>
</div>
