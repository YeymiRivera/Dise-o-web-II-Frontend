<div class="container mt-4">
  <h2 class="text-primary">{{ id() === null ? 'Nuevo Libro' : 'Editar Libro' }}</h2>

  <form (ngSubmit)="guardar()" class="card p-4 shadow-sm">
    @if (error(); as mensaje) {
      <div class="alert alert-danger">{{ mensaje }}</div>
    }

    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input id="titulo" name="titulo" type="text" class="form-control" maxlength="150" required [(ngModel)]="titulo" />
    </div>

    <div class="mb-3">
      <label for="autor" class="form-label">Autor</label>
      <input id="autor" name="autor" type="text" class="form-control" maxlength="100" required [(ngModel)]="autor" />
    </div>

    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN (opcional)</label>
      <input id="isbn" name="isbn" type="text" class="form-control" maxlength="20" [(ngModel)]="isbn" />
    </div>

    <div class="mb-3">
      <label for="categoriaId" class="form-label">Categoría</label>
      <select id="categoriaId" name="categoriaId" class="form-select" required [(ngModel)]="categoriaId">
        <option [ngValue]="0" disabled>Selecciona una categoría</option>
        @for (categoria of categorias(); track categoria.id) {
          <option [ngValue]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>
    </div>

    <div class="d-flex justify-content-between">
      <a routerLink="/libros" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-success" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
