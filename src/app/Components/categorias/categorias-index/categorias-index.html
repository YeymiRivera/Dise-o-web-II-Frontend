<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-primary">Categorías</h2>
    <a routerLink="/categorias/create" class="btn btn-primary">+ Nueva Categoría</a>
  </div>

  @if (error(); as mensaje) {
    <div class="alert alert-danger">{{ mensaje }}</div>
  }

  <div class="table-responsive">
    <table class="table table-striped shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @if (cargando()) {
          <tr>
            <td colspan="2" class="text-center">Cargando categorías...</td>
          </tr>
        } @else {
          @for (categoria of categorias(); track categoria.id) {
            <tr>
              <td>{{ categoria.nombre }}</td>
              <td class="text-end">
                <a [routerLink]="['/categorias/editar', categoria.id]" class="btn btn-sm btn-outline-primary me-2">Editar</a>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="eliminar(categoria)">Eliminar</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="text-center">No hay categorías registradas.</td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
