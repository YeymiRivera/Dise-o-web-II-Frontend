<div class="container mt-4">
    <h2 class="text-primary">Editar Multa</h2>
    @if (multaeditada; as multa) {
    <form  class="card p-4 shadow-sm">
        <div  class="text-danger"></div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label  class="form-label">Préstamo- {{multa.id}}</label>
                <span  class="text-danger"></span>
            </div>
            <div class="campo-multa campo-monto">
                <label for="monto">Monto</label>
                <input
                     id="monto"
            type="number"
            class="form-control"
            min="0.01"
            name="monto"
            [(ngModel)]="multa.monto"
            required
                />
            </div>
        </div>
        <div class="campo-multa campo-pago">
                <div class="opcion-pago">
                    <input
                        id="pagoRealizado"
                       
                        name="pagoRealizado"
                        type="checkbox"
                    />
                    <label for="pagoRealizado">Pago realizado</label>
                </div>
        </div>
        <div class="d-flex justify-content-between">
            <button (click)="Volver()" class="btn btn-secondary">Volver</button>
            <button  class="btn btn-success">Guardar Cambios</button>
        </div>
    </form>}
</div>
